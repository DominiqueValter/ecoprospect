version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecoprospect_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoprospect_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoprospect_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ecoprospect_db}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -u ${POSTGRES_USER:-ecoprospect_user} -d ${POSTGRES_DB:-ecoprospect_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecoprospect_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecoprospect.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
